dataset:
  root: ../data/plant_views
  expected_views_per_plant: 3
  view_ids: [0, 1, 2]

camera:
  intrinsics:
    width: 640
    height: 480
    fx: 392.2776184082031
    fy: 391.3633728027344
    cx: 323.5524597167969
    cy: 242.03379821777344

depth:
  unit: realsense_units
  scale_m_per_unit: 9.999999747378752e-05
  treat_65535_as_invalid: true
  range_filter:
    enabled: true
    min_m: 0.05
    max_m: 0.60

segmentation:
  model_path: ../models/best.pt
  device: cpu
  imgsz: 640
  conf: 0.35
  iou: 0.50
  max_det: 100
  min_mask_area_px: 1500
  classes: []

features:
  downsample_step: 1
  min_points: 50
  log_features: true

selected:
  enabled: true
  instance_id: 1
  min_pixels: 50
  darken_factor: 0.3
  draw_bbox: true

poses:
  pose_file: ""
  default_pose:
    t_xyz: [0.0, 0.0, 0.0]
    q_xyzw: [0.0, 0.0, 0.0, 1.0]

robot:
  model: Meca500
  ip: ""
  wrf_equals_brf: true
  euler_convention: RzRyRx_deg

  # CAM(optical) -> TRF correction (from cloud overlap / plant_000)
  cam_axes_correction_R_trf_cam_row_major_3x3: [0, 0, 1, 0, -1, 0, 1, 0, 0]
  camera_in_trf_translation_mm: [-125.695, 11.500, -42.251]

  views:
    "0":
      key: "l"
      pose_wrf_mm_deg: [188.205, 58.384, 249.002, 63.286, 55.563, 127.337]
    "1":
      key: "m"
      pose_wrf_mm_deg: [148.567, 0.000, 283.585, 179.999, 90.000, 0.000]
    "2":
      key: "r"
      pose_wrf_mm_deg: [195.183, -34.680, 243.936, -71.161, 50.263, -104.430]

outputs:
  out_root: outputs
  save_overlay: true
  save_label_vis: true
  save_depth_mask_preview: true

  raw_cloud:
    enabled: true
    export_frame: world
    save_once_per_view: true
    overwrite: true
    ply_ascii: true

  cluster:
    enabled: true
    distance_threshold_m: 0.06
    max_clusters: 50
    ply_ascii: true
    export_fused_plant_cloud: true
    fused_filename: plant_fused.ply
    fused_voxel_size: 0.0
    fused_max_points: 0
    max_points_per_cluster: 200000
    flip_y: false
